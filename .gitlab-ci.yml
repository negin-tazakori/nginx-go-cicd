stages:
  - test
  - build
  - deploy


test-backend:
  stage: test
  tags: 
    - nginx-runner
  image: golang:1.25-alpine
  script:
    - cd backend
    - go vet ./...
    - go test ./...


build-front:
  stage: build
  tags:
    - nginx-runner
  image: docker:27

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

  script:
    - docker build -t frontend:$CI_COMMIT_SHORT_SHA ./frontend
    - docker tag frontend:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA


build-back:
  stage: build
  tags:
    - nginx-runner
  image: docker:27
  
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  
  script:
    - docker build -t backend:$CI_COMMIT_SHORT_SHA ./backend
    - docker tag backend:$CI_COMMIT_SHORT_SHA  $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA

deploy:
  stage: deploy
  tags:
    - nginx-runner
  image: alpine:3.20
  only: 
    - main  

  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
  script:
    - ssh $SERVER_USER@$SERVER_IP "mkdir -p ~/app"
    - scp docker-compose.yml $SERVER_USER@$SERVER_IP:~/app/docker-compose.yml
    - |
      ssh $SERVER_USER@$SERVER_IP "cat > ~/app/.env <<EOF
      CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE
      IMAGE_TAG=$CI_COMMIT_SHORT_SHA
      POSTGRES_USER=$POSTGRES_USER
      POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      POSTGRES_DB=$POSTGRES_DB
      EOF"
    - ssh $SERVER_USER@$SERVER_IP "echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY"
    - ssh $SERVER_USER@$SERVER_IP "cd ~/app && docker compose pull && docker compose up -d"
